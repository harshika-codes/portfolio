<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI Projects</title>
    <style>
        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#0f0f1a,#1b1433,#24154a);
            color:white;
        }

        .container{
            width:90%;
            margin:auto;
            padding:30px 0 50px;
            text-align:center;
            position:relative;
        }

        .back-btn{
            position:absolute;
            top:10px;
            left:0;
            display:inline-block;
            text-decoration:none;
            background:linear-gradient(90deg,#7b2cff,#9d4edd);
            color:white;
            padding:10px 22px;
            border-radius:25px;
            font-size:16px;
            font-weight:bold;
            transition:0.3s;
        }

        .back-btn:hover{
            transform:scale(1.05);
        }

        h1{
            font-size:42px;
            margin-bottom:40px;
            margin-top:40px;
        }

        .projects-grid{
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:30px;
        }

        .project-card{
            background:#2b2b3d;
            border:1px solid rgba(255,255,255,0.15);
            border-radius:25px;
            padding:35px 25px;
            width:320px;
            box-shadow:0 0 25px rgba(123,44,255,0.35);
            transition:0.3s ease;
        }

        .project-card:hover{
            transform:translateY(-8px);
            box-shadow:0 0 35px rgba(123,44,255,0.6);
        }

        .project-card h3{
            font-size:34px;
            margin-bottom:15px;
        }

        .project-card p{
            font-size:18px;
            color:#d8d8d8;
            margin-bottom:25px;
        }

        .project-btn{
            display:inline-block;
            text-decoration:none;
            background:linear-gradient(90deg,#7b2cff,#9d4edd);
            color:white;
            padding:12px 28px;
            border-radius:30px;
            font-size:18px;
            font-weight:bold;
            transition:0.3s;
        }

        .project-btn:hover{
            transform:scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">

        <a href="/learn-more" class="back-btn">← Back</a>

        <h1>📊 Power BI Projects</h1>

        <div class="projects-grid">
        <div class="project-card">
    <h3>📈 Production Sale</h3>
    <p>Power BI dashboard for production and sales analysis.</p>
    <a href="https://github.com/harshika-codes/AIML-Bootcamp/blob/main/Power%20BI/Power%20BI.pdf" target="_blank" class="project-btn">View →</a>
  
        </div>
    </div>
</body>
</html>
