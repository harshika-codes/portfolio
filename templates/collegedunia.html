<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Collegedunia Scraped Data</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f0f1a;
    color:white;
}

.back{
    position:fixed;
    top:15px;
    left:15px;
    padding:10px 18px;
    background:#7c4dff;
    color:white;
    border-radius:20px;
    text-decoration:none;
}

h1{
    text-align:center;
    margin-top:50px;
    color:#7c4dff;
}

table{
    width:90%;
    margin:40px auto;
    border-collapse:collapse;
}

th,td{
    border:1px solid #333;
    padding:12px;
    text-align:center;
}

th{
    background:#7c4dff;
}

tr:hover{
    background:#222;
}

</style>
</head>

<body>

<a href="/static-scraping" class="back">← Back</a>

<h1>🎓 Collegedunia Scraped Data</h1>

<table>
    <tr>
        <th>Name</th>
        <th>Info</th>
        <th>Rating</th>
    </tr>

    {% for item in data %}
    <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.info }}</td>
        <td>{{ item.rating }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
