<!DOCTYPE html>
<html>
<head>
    <title>Gyan Setu Courses</title>
    <style>
        body{
            font-family: Arial;
            background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
            color: white;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h1{
            color:#7c4dff;
            margin-bottom: 30px;
            font-size: 42px;
        }

        .table-box{
            width: 95%;
            margin: auto;
            background: rgba(255,255,255,0.08);
            border:1px solid rgba(255,255,255,0.15);
            border-radius:18px;
            box-shadow:0 0 20px rgba(124,77,255,0.25);
            overflow:hidden;
        }

        table{
            width:100%;
            border-collapse: collapse;
        }

        th, td{
            padding:18px;
            border-bottom:1px solid rgba(255,255,255,0.12);
            text-align:center;
        }

        th{
            background:#7c4dff;
            color:white;
            font-size:18px;
        }

        tr:hover{
            background:rgba(255,255,255,0.05);
        }

        td{
            font-size:16px;
        }

        .back{
            display:inline-block;
            margin-top:30px;
            padding:12px 25px;
            background:#7c4dff;
            color:white;
            text-decoration:none;
            border-radius:25px;
            transition:0.3s;
        }

        .back:hover{
            background:#5a2fd6;
            transform:scale(1.05);
        }
    </style>
</head>
<body>

    <h1>{{ data.title }}</h1>

    <div class="table-box">
        <table>
            <tr>
                <th>Course Name</th>
                <th>Mode</th>
                <th>Duration</th>
                
            </tr>

            {% for item in data.courses %}
            <tr>
                <td>{{ item.course_name }}</td>
                <td>{{ item.mode }}</td>
                <td>{{ item.duration }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

    <a class="back" href="/api">← Back</a>

</body>
</html>
