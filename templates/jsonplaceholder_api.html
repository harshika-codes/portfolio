<!DOCTYPE html>
<html>
<head>
    <title>JSONPlaceholder API</title>
    <style>
        body{
            font-family: Arial;
            background:#0f0f1a;
            color:white;
            margin:0;
            padding:30px;
            text-align:center;
        }

        h1{
            color:#7c4dff;
            margin-bottom:30px;
            font-size:38px;
            text-shadow: 0 0 15px rgba(124,77,255,0.4);
        }

        table{
            width:95%;
            margin:auto;
            border-collapse:collapse;
            background:#1a1a2e;
            box-shadow:0 0 20px rgba(124,77,255,0.25);
            border-radius:12px;
            overflow:hidden;
        }

        th, td{
            padding:16px;
            border:1px solid #3a3a55;
            text-align:center;
            vertical-align:top;
            color:white;
        }

        th{
            background:linear-gradient(90deg, #7c4dff, #8f5cff);
            color:white;
            font-size:24px;
        }

        td{
            background:#23233a;
            font-size:18px;
        }

        tr:nth-child(even) td{
            background:#2b2b45;
        }

        .back{
            display:inline-block;
            margin-top:30px;
            padding:12px 26px;
            background:#7c4dff;
            color:white;
            text-decoration:none;
            border-radius:25px;
            font-size:20px;
            transition:0.3s;
        }

        .back:hover{
            background:#9d74ff;
            transform:scale(1.05);
        }
    </style>
</head>
<body>

    <h1>📝 JSONPlaceholder API Data</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Body</th>
        </tr>

        {% for post in posts %}
        <tr>
            <td>{{ post.id }}</td>
            <td>{{ post.title }}</td>
            <td>{{ post.body }}</td>
        </tr>
        {% endfor %}
    </table>

    <a class="back" href="/api">← Back</a>

</body>
</html>
