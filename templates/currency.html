<!DOCTYPE html>
<html>
<head>
    <title>Currency API</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#111;
            color:white;
            text-align:center;
            margin:0;
            padding:40px;
        }

        h1{
            color:#7c4dff;
            margin-bottom:25px;
            margin-top:30px;
        }

        table{
            width:70%;
            margin:auto;
            border-collapse:collapse;
            background:#1c1c2e;
            border-radius:10px;
            overflow:hidden;
        }

        th, td{
            padding:15px;
            border:1px solid #333;
        }

        th{
            background:#7c4dff;
            color:white;
        }

        tr:nth-child(even){
            background:#2a2a40;
        }

        /* BACK BUTTON UPPER LEFT */
        .back-btn{
            position:fixed;
            top:20px;
            left:20px;
            background:#7c4dff;
            color:white;
            text-decoration:none;
            padding:10px 18px;
            border-radius:8px;
            font-weight:bold;
            box-shadow:0 0 10px rgba(124,77,255,0.6);
            z-index:999;
        }

        .back-btn:hover{
            background:#6a3dff;
        }

        /* content thoda neeche aaye */
        .container{
            margin-top:60px;
        }
    </style>
</head>
<body>

    <!-- Back button upar -->
    <a href="/api" class="back-btn">⬅ Back</a>

    <div class="container">
        <h1>Currency Exchange Rates</h1>

        <table>
            <tr>
                <th>Currency</th>
                <th>Rate</th>
            </tr>

            {% for item in data %}
            <tr>
                <td>{{ item.currency }}</td>
                <td>{{ item.rate }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

</body>
</html>
