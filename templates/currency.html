<!DOCTYPE html>
<html>
<head>
    <title>Currency API</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#111;
            color:white;
            text-align:center;
            margin:0;
            padding:40px;
        }

        h1{
            color:#7c4dff;
            margin-bottom:25px;
            margin-top:30px;
        }

        table{
            width:70%;
            margin:auto;
            border-collapse:collapse;
            background:#1c1c2e;
            border-radius:10px;
            overflow:hidden;
        }

        th, td{
            padding:15px;
            border:1px solid #333;
        }

        th{
            background:#7c4dff;
            color:white;
        }

        tr:nth-child(even){
            background:#2a2a40;
        }

        .back-btn{
            display:inline-block;
            margin-top:25px;
            background:#7c4dff;
            color:white;
            text-decoration:none;
            padding:10px 18px;
            border-radius:8px;
            font-weight:bold;
            box-shadow:0 0 10px rgba(124,77,255,0.6);
        }

        .back-btn:hover{
            background:#6a3dff;
        }
    </style>
</head>
<body>

    <h1>Currency Exchange Rates</h1>

    <table>
        <tr>
            <th>Currency</th>
            <th>Rate</th>
        </tr>

        {% for item in data %}
        <tr>
            <td>{{ item.currency }}</td>
            <td>{{ item.rate }}</td>
        </tr>
        {% endfor %}
    </table>

    <!-- Back button niche -->
    <a href="/api" class="back-btn">⬅ Back</a>

</body>
</html>
