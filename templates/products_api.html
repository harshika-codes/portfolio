<!DOCTYPE html>
<html>
<head>
    <title>Products API</title>
    <style>
        body{
            font-family:Arial;
            background:#0f0f1a;
            color:white;
            text-align:center;
            padding:30px;
        }

        h1{
            color:#7c4dff;
        }

        table{
            width:95%;
            margin:auto;
            border-collapse:collapse;
            background:#1a1a2e;
        }

        th, td{
            padding:12px;
            border:1px solid #444;
        }

        th{
            background:#7c4dff;
        }

        .back{
            display:inline-block;
            margin-top:20px;
            padding:10px 20px;
            background:#7c4dff;
            color:white;
            text-decoration:none;
            border-radius:20px;
        }
    </style>
</head>
<body>

    <h1>Products API Data</h1>

    <table>
        <tr>
            <th>Title</th>
            <th>Price</th>
            <th>Category</th>
            <th>Brand</th>
            <th>Rating</th>
        </tr>

        {% for p in products %}
        <tr>
            <td>{{ p.title }}</td>
            <td>{{ p.price }}</td>
            <td>{{ p.category }}</td>
            <td>{{ p.brand }}</td>
            <td>{{ p.rating }}</td>
        </tr>
        {% endfor %}
    </table>

    <a class="back" href="/api">← Back</a>

</body>
</html>
