<!DOCTYPE html>
<html>
<head>
    <title>Products API</title>
    <style>
        body{
            font-family: Arial;
            background:#0f0f1a;
            color:white;
            text-align:center;
            padding:30px;
            margin:0;
        }

        h1{
            color:#7c4dff;
            margin-top:40px;
            margin-bottom:25px;
        }

        table{
            width:95%;
            margin:auto;
            border-collapse:collapse;
            background:#1a1a2e;
        }

        th, td{
            padding:12px;
            border:1px solid #444;
        }

        th{
            background:#7c4dff;
        }

        tr:nth-child(even){
            background:#23233a;
        }

        /* BACK BUTTON UPPER LEFT */
        .back{
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background:#7c4dff;
            color:white;
            text-decoration:none;
            border-radius:20px;
            font-weight:bold;
            z-index:999;
            box-shadow:0 0 12px rgba(124,77,255,0.5);
        }

        .back:hover{
            background:#5f35d4;
        }

        /* content thoda neeche */
        .container{
            margin-top:60px;
        }
    </style>
</head>
<body>

    <!-- Back button upar -->
    <a class="back" href="/api">← Back</a>

    <div class="container">
        <h1>Products API Data</h1>

        <table>
            <tr>
                <th>Title</th>
                <th>Price</th>
                <th>Category</th>
                <th>Brand</th>
                <th>Rating</th>
            </tr>

            {% for p in products %}
            <tr>
                <td>{{ p.title }}</td>
                <td>{{ p.price }}</td>
                <td>{{ p.category }}</td>
                <td>{{ p.brand }}</td>
                <td>{{ p.rating }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

</body>
</html>
